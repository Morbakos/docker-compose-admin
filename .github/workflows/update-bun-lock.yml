name: Update Bun lockfile

on:
  push:
    branches: [feat/compose-dashboard-mvp]
    paths: [package.json]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compose-dashboard-mvp
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve and lock dependencies
        run: bun install
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: update Bun lockfile for Angular tests"
          git push

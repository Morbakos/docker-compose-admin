<section
	class="compose-progress"
	[class.is-fullscreen]="fullscreen()">
	<header>
		<div><strong>Activité au démarrage</strong><span>{{lines().length}} lignes</span></div>
		<button
			type="button"
			class="clean-logs-button"
			(click)="clearLogs()"
			[attr.aria-label]="'Vider les logs'">
			Vider les logs
		</button>
		<button
			type="button"
			class="fullscreen-button"
			(click)="toggleFullscreen()"
			[attr.aria-label]="fullscreen() ? 'Quitter le plein écran' : 'Afficher en plein écran'">
			{{ fullscreen() ? '↙ Réduire' : '⛶ Plein écran' }}
		</button>
	</header>

	<div class="console" #console (scroll)="onScroll()">
		@for (entry of lines(); track $index) {
		<div
			class="log-line"
			[class.error]="entry.stream === 'stderr'">
			<span class="timestamp">{{ entry.timestamp | date:'HH:mm:ss' }}</span>
			<span class="message">{{ entry.line }}</span>
		</div>
		}
	</div>
</section>
